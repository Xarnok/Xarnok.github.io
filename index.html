<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Champion de Conjugaison ! ✏️</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#A1C6EA">
    <link rel="apple-touch-icon" href="icon-192.png">
    <!-- Police d'écriture adaptée aux enfants et à la lecture -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
    <style>
        :root {
            --primary: #4A90E2;
            --success: #2ECC71;
            --error: #E74C3C;
            --bg: #F4F9FF;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Fredoka', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            font-size: 2.2rem;
            text-shadow: 2px 2px 0px #D0E1FD;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #7F8C8D;
            font-size: 1.1rem;
        }

        .container {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(74, 144, 226, 0.15);
            border: 4px solid #D0E1FD;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            text-align: center;
            position: relative;
        }

        /* Écran de configuration */
        .setup-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .field-group {
            text-align: left;
        }

        label {
            font-weight: 600;
            font-size: 1.2rem;
            display: block;
            margin-bottom: 8px;
            color: var(--primary);
        }

        select {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.1rem;
            border: 2px solid #BDC3C7;
            border-radius: 12px;
            background-color: #FAFAFA;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 0px #27AE60;
            transition: all 0.1s ease;
            width: 100%;
            margin-top: 10px;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #27AE60;
        }

        button.secondary {
            background-color: var(--primary);
            box-shadow: 0 6px 0px #34495E;
            box-shadow: 0 6px 0px #2980B9;
        }
        button.secondary:active {
            box-shadow: 0 2px 0px #2980B9;
        }

        /* Écran de Jeu */
        .hidden {
            display: none !important;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
            background: #EDF5FF;
            padding: 10px 15px;
            border-radius: 12px;
        }

        .stars {
            color: #F1C40F;
            font-size: 1.3rem;
        }

        .question-box {
            background: #FFF9E6;
            border: 3px dashed #F1C40F;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .verb-to-conjugate {
            font-size: 1.8rem;
            font-weight: 600;
            color: #D35400;
            margin-bottom: 5px;
        }

        .verb-info {
            font-size: 0.9rem;
            color: #7F8C8D;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .prompt-zone {
            font-size: 1.6rem;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pronoun {
            font-weight: 600;
            background: #E8F4F8;
            padding: 4px 12px;
            border-radius: 8px;
        }

        input[type="text"] {
            padding: 10px 15px;
            font-size: 1.4rem;
            border: 3px solid #BDC3C7;
            border-radius: 12px;
            width: 180px;
            text-align: center;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        /* Feedback */
        .feedback {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 15px 0;
            padding: 12px;
            border-radius: 12px;
            animation: pop 0.3s ease;
        }

        .feedback.correct {
            background-color: #E8F8F5;
            color: var(--success);
        }

        .feedback.wrong {
            background-color: #FCE4D6;
            color: var(--error);
        }

        @keyframes pop {
            0% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        /* Confettis minimalistes CSS pour le succès */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: red;
            animation: drop 1.5s infinite;
            border-radius: 50%;
            opacity: 0;
        }

        @keyframes drop {
            0% { top: 0; opacity: 1; transform: translateX(0) rotate(0deg); }
            100% { top: 100%; opacity: 0; transform: translateX(100px) rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <h1>✏️ Mission Conjugaison</h1>
        <p class="subtitle">Le jeu des champions de CE1</p>
    </header>

    <div class="container">
        
        <!-- ÉCRAN CONFIGURATION -->
        <div id="setupScreen" class="setup-screen">
            <div class="field-group">
                <label for="timeSelect">⏱️ Choisis le temps :</label>
                <select id="timeSelect">
                    <option value="présent">Présent</option>
                    <option value="futur">Futur</option>
                    <option value="imparfait">Imparfait</option>
                </select>
            </div>

            <div class="field-group">
                <label for="groupSelect">📚 Choisis les verbes :</label>
                <select id="groupSelect">
                    <option value="1er">1er groupe (en -er : chanter, jouer...)</option>
                    <option value="3eme">Verbes essentiels (être, avoir, aller...)</option>
                    <option value="tous">Tous les verbes de CE1</option>
                </select>
            </div>

            <button onclick="startGame()">C'est parti ! 🚀</button>
        </div>

        <!-- ÉCRAN DE JEU -->
        <div id="gameScreen" class="game-screen hidden">
            <div class="score-board">
                <span id="questionCount">Question : 1 / 5</span>
                <span class="stars" id="starsDisplay">⭐ 0</span>
            </div>

            <div class="question-box">
                <div class="verb-to-conjugate" id="currentVerb">??</div>
                <div class="verb-info" id="currentInfo">??</div>
            </div>

            <div class="prompt-zone">
                <span class="pronoun" id="currentPronoun">??</span>
                <!-- Pas d'attributs vulnérables, traitement sain des entrées -->
                <input type="text" id="answerInput" autocomplete="off" spaceholder="..." autofocus>
            </div>

            <div id="feedbackBox" class="feedback hidden"></div>

            <button id="actionBtn" onclick="checkAnswer()">Vérifier ✔️</button>
            <button id="homeBtn" class="secondary hidden" onclick="resetGame()" style="margin-top: 10px;">Changer de niveau 🏠</button>
        </div>

    </div>

    <script>
        // Base de données des verbes au programme de CE1
        const database = {
            "1er": [
                { infinitif: "chanter", groupe: "1er", conjugaisons: {
                    "présent": ["chante", "chantes", "chante", "chantons", "chantez", "chantent"],
                    "futur": ["chanterai", "chanteras", "chantera", "chanterons", "chanterez", "chanteront"],
                    "imparfait": ["chantais", "chantais", "chantait", "chantions", "chantiez", "chantaient"]
                }},
                { infinitif: "jouer", groupe: "1er", conjugaisons: {
                    "présent": ["joue", "joues", "joue", "jouons", "jouez", "jouent"],
                    "futur": ["jouerai", "joueras", "jouera", "jouerons", "jouerez", "joueront"],
                    "imparfait": ["jouais", "jouais", "jouait", "jouions", "jouiez", "jouaient"]
                }},
                { infinitif: "manger", groupe: "1er", notes: "attention au g", conjugaisons: {
                    "présent": ["mange", "manges", "mange", "mangeons", "mangez", "mangent"],
                    "futur": ["mangerai", "mangeras", "mangera", "mangerons", "mangerez", "mangeront"],
                    "imparfait": ["mangeais", "mangeais", "mangeait", "mangions", "mangiez", "mangeaient"]
                }}
            ],
            "3eme": [
                { infinitif: "être", groupe: "3ème", conjugaisons: {
                    "présent": ["suis", "es", "est", "sommes", "êtes", "sont"],
                    "futur": ["serai", "seras", "sera", "serons", "serez", "seront"],
                    "imparfait": ["étais", "étais", "était", "étions", "étiez", "étaient"]
                }},
                { infinitif: "avoir", groupe: "3ème", conjugaisons: {
                    "présent": ["ai", "as", "a", "avons", "avez", "ont"],
                    "futur": ["aurai", "auras", "aura", "aurons", "aurez", "auront"],
                    "imparfait": ["avais", "avais", "avait", "avions", "aviez", "avaient"]
                }},
                { infinitif: "aller", groupe: "3ème", conjugaisons: {
                    "présent": ["vais", "vas", "va", "allons", "allez", "vont"],
                    "futur": ["irai", "iras", "ira", "irons", "irez", "iront"],
                    "imparfait": ["allais", "allais", "allait", "allions", "alliez", "allaient"]
                }},
                { infinitif: "faire", groupe: "3ème", conjugaisons: {
                    "présent": ["fais", "fais", "fait", "faisons", "faites", "font"],
                    "futur": ["ferai", "feras", "fera", "ferons", "ferez", "feront"],
                    "imparfait": ["faisais", "faisais", "faisait", "faisions", "faisiez", "faisaient"]
                }},
                { infinitif: "dire", groupe: "3ème", conjugaisons: {
                    "présent": ["dis", "dis", "dit", "disons", "dites", "disent"],
                    "futur": ["dirai", "diras", "dira", "dirons", "direz", "diront"],
                    "imparfait": ["disais", "disais", "disait", "disions", "disiez", "disaient"]
                }}
            ]
        };

        const pronoms = ["Je", "Tu", "Il / Elle / On", "Nous", "Vous", "Ils / Elles"];
        
        // Elisions pour "Je" devant une voyelle
        function ajusterPronom(pronom, verbeConjugue) {
            if (pronom.toLowerCase() === "je") {
                const voyelles = ["a", "e", "i", "o", "u", "é", "è", "ê", "â"];
                if (voyelles.includes(verbeConjugue.charAt(0).toLowerCase())) {
                    return "J'";
                }
            }
            return pronom;
        }

        let gameState = {
            selectedTime: "",
            selectedGroup: "",
            pool: [],
            currentIndex: 0,
            score: 0,
            maxQuestions: 5,
            currentQuestion: null
        };

        function startGame() {
            gameState.selectedTime = document.getElementById("timeSelect").value;
            gameState.selectedGroup = document.getElementById("groupSelect").value;
            
            // Construction de la liste de verbes selon le choix
            if (gameState.selectedGroup === "tous") {
                gameState.pool = [...database["1er"], ...database["3eme"]];
            } else {
                gameState.pool = [...database[gameState.selectedGroup]];
            }

            gameState.currentIndex = 0;
            gameState.score = 0;
            
            document.getElementById("setupScreen").classList.add("hidden");
            document.getElementById("gameScreen").classList.remove("hidden");
            document.getElementById("homeBtn").classList.add("hidden");

            generateQuestion();
        }

        function generateQuestion() {
            gameState.currentIndex++;
            if (gameState.currentIndex > gameState.maxQuestions) {
                endGame();
                return;
            }

            document.getElementById("questionCount").textContent = `Question : ${gameState.currentIndex} / ${gameState.maxQuestions}`;
            document.getElementById("feedbackBox").classList.add("hidden");
            document.getElementById("answerInput").value = "";
            document.getElementById("answerInput").disabled = false;
            
            const actionBtn = document.getElementById("actionBtn");
            actionBtn.textContent = "Vérifier ✔️";
            actionBtn.onclick = checkAnswer;

            // Sélection aléatoire verbe + pronom
            const randomVerb = gameState.pool[Math.floor(Math.random() * gameState.pool.length)];
            const pIndex = Math.floor(Math.random() * pronoms.length);
            const rawPronoun = pronoms[pIndex];
            const correctSolution = randomVerb.conjugaisons[gameState.selectedTime][pIndex];

            gameState.currentQuestion = {
                verb: randomVerb.infinitif,
                time: gameState.selectedTime,
                pronoun: rawPronoun,
                solution: correctSolution
            };

            document.getElementById("currentVerb").textContent = randomVerb.infinitif;
            document.getElementById("currentInfo").textContent = `${randomVerb.groupe} groupe • ${gameState.selectedTime}`;
            document.getElementById("currentPronoun").textContent = ajusterPronom(rawPronoun, correctSolution);
            
            document.getElementById("answerInput").focus();
        }

        function checkAnswer() {
            const userInput = document.getElementById("answerInput").value.trim().toLowerCase();
            const solution = gameState.currentQuestion.solution.toLowerCase();
            const feedbackBox = document.getElementById("feedbackBox");
            
            document.getElementById("answerInput").disabled = true;
            feedbackBox.classList.remove("hidden");
            feedbackBox.className = "feedback"; // reset classes

            // Utilisation sécurisée de textContent contre les failles XSS
            if (userInput === solution) {
                gameState.score++;
                feedbackBox.textContent = "Bravo ! C'est parfait ! 🎉";
                feedbackBox.classList.add("correct");
                document.getElementById("starsDisplay").textContent = `⭐ ${gameState.score}`;
                triggerConfetti();
            } else {
                feedbackBox.textContent = `Presque ! Il fallait écrire : ${gameState.currentQuestion.solution}`;
                feedbackBox.classList.add("wrong");
            }

            const actionBtn = document.getElementById("actionBtn");
            if (gameState.currentIndex < gameState.maxQuestions) {
                actionBtn.textContent = "Continuer ➡️";
                actionBtn.onclick = generateQuestion;
            } else {
                actionBtn.textContent = "Voir le résultat 🏁";
                actionBtn.onclick = endGame;
            }
        }

        function endGame() {
            document.getElementById("questionCount").textContent = "Fin de l'exercice !";
            document.getElementById("currentVerb").textContent = "🏆 Résultat";
            
            let appreciation = "Continue à t'entraîner ! 💪";
            if (gameState.score === 5) appreciation = "Parfait ! Tu es un champion ! 👑";
            else if (gameState.score >= 3) appreciation = "Très bien ! Bon travail ! 🌟";

            document.getElementById("currentInfo").textContent = appreciation;
            document.getElementById("feedbackBox").classList.add("hidden");
            
            // Affichage propre du score final sans innerHTML vulnérable
            const promptZone = document.querySelector(".prompt-zone");
            promptZone.textContent = `Tu as obtenu ${gameState.score} étoile(s) sur ${gameState.maxQuestions} !`;

            const actionBtn = document.getElementById("actionBtn");
            actionBtn.classList.add("hidden");
            document.getElementById("homeBtn").classList.remove("hidden");
        }

        function resetGame() {
            // Recharger proprement l'écran pour une nouvelle session
            location.reload();
        }

        function triggerConfetti() {
            // Petits éclats visuels éphémères autour de la boîte
            for (let i = 0; i < 15; i++) {
                const c = document.createElement("div");
                c.className = "confetti";
                c.style.left = Math.random() * 100 + "%";
                c.style.background = ["#F1C40F", "#2ECC71", "#E74C3C", "#3498DB"][Math.floor(Math.random() * 4)];
                c.style.animationDelay = Math.random() * 0.5 + "s";
                document.querySelector(".container").appendChild(c);
                setTimeout(() => c.remove(), 1500);
            }
        }

        // Enregistrement du Service Worker pour la PWA (mode hors-ligne)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker enregistré !', reg))
                    .catch(err => console.log('Erreur SW', err));
            });
        }
    </script>
</body>
</html>
